<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crypto Strategy Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>

            <div>
                <h1>Crypto Strategy Dashboard</h1>
                <p id="market-info">Loading...</p>
            </div>

            <div class="price-box">
                <div id="btc-price">—</div>
                <div id="last-update">—</div>
            </div>

        </header>


        <!-- Charts -->
        <section class="charts-section">

            <!-- BTC -->
            <div class="chart-section">

                <div class="chart-header">
                    <h2>BTCUSDT</h2>
                    <span>12H</span>
                </div>

                <div class="tradingview-widget-container">

                    <div class="tradingview-widget-container__widget"></div>

                    <script
                        type="text/javascript"
                        src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                        async
                    >
                    {
                        "autosize": true,
                        "symbol": "BINANCE:BTCUSDT",
                        "interval": "12H",
                        "timezone": "Etc/UTC",
                        "theme": "dark",
                        "style": "1",
                        "withdateranges": true,
                        "hide_side_toolbar": true,
                        "allow_symbol_change": false,
                        "save_image": false,
                        "hide_top_toolbar": false,
                        "hide_legend": false,
                        "hide_volume": false,
                        "calendar": false,
                        "support_host": "https://www.tradingview.com"
                    }
                    </script>

                </div>

            </div>


            <!-- ETH -->
            <div class="chart-section">

                <div class="chart-header">
                    <h2>ETHUSDT</h2>
                    <span>12H</span>
                </div>

                <div class="tradingview-widget-container">

                    <div class="tradingview-widget-container__widget"></div>

                    <script
                        type="text/javascript"
                        src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                        async
                    >
                    {
                        "autosize": true,
                        "symbol": "BINANCE:ETHUSDT",
                        "interval": "12H",
                        "timezone": "Etc/UTC",
                        "theme": "dark",
                        "style": "1",
                        "withdateranges": true,
                        "hide_side_toolbar": true,
                        "allow_symbol_change": false,
                        "save_image": false,
                        "hide_top_toolbar": false,
                        "hide_legend": false,
                        "hide_volume": false,
                        "calendar": false,
                        "support_host": "https://www.tradingview.com"
                    }
                    </script>

                </div>

            </div>

        </section>


        <!-- Strategies -->
        <main>

            <h2>Strategies</h2>

            <div id="strategies" class="strategy-grid">
                <!-- Strategy cards are generated by app.js -->
            </div>

        </main>

    </div>


    <script src="app.js"></script>

</body>
</html>
